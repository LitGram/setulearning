<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#567168"/></marker></defs><rect width="1280" height="980" fill="white"/><text x="640" y="62" text-anchor="middle" fill="#123d33" font-size="40" font-weight="bold" font-family="Arial, sans-serif">Incomplete dominance versus codominance</text><path d="M55 91 L1225 91" stroke="#cae4da" stroke-width="3" fill="none"/><text x="320" y="155" text-anchor="middle" fill="#183d33" font-size="34" font-weight="normal" font-family="Arial, sans-serif">Incomplete dominance</text><text x="960" y="155" text-anchor="middle" fill="#183d33" font-size="34" font-weight="normal" font-family="Arial, sans-serif">Codominance</text><circle cx="190" cy="280" r="50" fill="#c84b5b" stroke="#c84b5b" stroke-width="3"/><circle cx="450" cy="280" r="50" fill="#fff" stroke="#aeb9b4" stroke-width="3"/><text x="320" y="290" text-anchor="middle" fill="#183d33" font-size="40" font-weight="normal" font-family="Arial, sans-serif">×</text><text x="190" y="370" text-anchor="middle" fill="#183d33" font-size="29" font-weight="normal" font-family="Arial, sans-serif">RR: red</text><text x="450" y="370" text-anchor="middle" fill="#183d33" font-size="29" font-weight="normal" font-family="Arial, sans-serif">rr: white</text><path d="M320 390 L320 480" stroke="#567168" stroke-width="4" fill="none" marker-end="url(#arrow)"/><circle cx="320" cy="560" r="72" fill="#edaab9" stroke="#ce6685" stroke-width="3"/><text x="320" y="684" text-anchor="middle" fill="#183d33" font-size="30" font-weight="normal" font-family="Arial, sans-serif">Rr: pink flower</text><rect x="775" y="230" width="370" height="110" rx="18" fill="#e6eefb" stroke="#bdcfc8" stroke-width="2"/><text x="960" y="293" text-anchor="middle" fill="#183d33" font-size="36" font-weight="normal" font-family="Arial, sans-serif">IA + IB</text><path d="M960 352 L9
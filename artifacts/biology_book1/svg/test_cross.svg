<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#567168"/></marker></defs><rect width="1280" height="980" fill="white"/><text x="640" y="62" text-anchor="middle" fill="#123d33" font-size="40" font-weight="bold" font-family="Arial, sans-serif">Test cross: TT or Tt?</text><path d="M55 91 L1225 91" stroke="#cae4da" stroke-width="3" fill="none"/><rect x="390" y="130" width="500" height="105" rx="18" fill="#e5eefb" stroke="#bdcfc8" stroke-width="2"/><text x="640" y="190.5" text-anchor="middle" fill="#183d33" font-size="31" font-weight="normal" font-family="Arial, sans-serif">Dominant-looking parent: T_</text><path d="M510 240 L310 310" stroke="#567168" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M770 240 L970 310" stroke="#567168" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="95" y="325" width="450" height="100" rx="18" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="320" y="383" text-anchor="middle" fill="#183d33" font-size="32" font-weight="normal" font-family="Arial, sans-serif">If TT: cross with tt</text><rect x="735" y="325" width="450" height="100" rx="18" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="960" y="383" text-anchor="middle" fill="#183d33" font-size="32" font-weight="normal" font-family="Arial, sans-serif">If Tt: cross with tt</text><path d="M320 435 L320 510" stroke="#567168" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M960 435 L960 510" stroke="#567168" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="95" y="525" width="450" height="135" rx="18" fill="#e6effb" stroke="#bdcfc8" stroke-width="2"/><text x="320" y="600.5" text-anchor="middle" fill="#183d33" font-size="32" font-weight="normal" font-family="Arial, sans-serif">All offspring Tt</text><rect x="735" y="525" width="450" height="135" rx="18" fill="#fdeee8" stroke="#bdcfc8" stroke-width="2"/><text x="960" y="600.5" text-anchor="middle" fill="#183d33" font-size="32" font-weight="normal" font-family="Arial, sans-serif">1 Tt : 1 tt expected</text><text x="320" y="740" text-anchor="middle" fill="#183d33" font-size="28" font-weight="normal" font-family="Arial, sans-serif">All show dominant trait</text><text x="960" y="740" text-anchor="middle" fill="#183d33" font-size="28" font-weight="normal" font-family="Arial, sans-serif">Half recessive expected</text><rect x="45" y="830" width="1190" height="115" rx="18" fill="#f1f6f4" stroke="#d8e6df" stroke-width="2"/><text x="640" y="870" text-anchor="middle" fill="#183d33" font-size="25" font-weight="normal" font-family="Arial, sans-serif">A recessive offspring reveals a recessive allele in the dominant-looking</text><text x="640" y="904" text-anchor="middle" fill="#183d33" font-size="25" font-weight="normal" font-family="Arial, sans-serif">parent.</text><text x="1205" y="972" text-anchor="end" fill="#658074" font-size="15" font-weight="normal" font-family="Arial, sans-serif">SCHEMATIC</text></svg>
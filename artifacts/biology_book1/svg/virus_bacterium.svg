<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#567168"/></marker></defs><rect width="1280" height="980" fill="white"/><text x="640" y="62" text-anchor="middle" fill="#123d33" font-size="40" font-weight="bold" font-family="Arial, sans-serif">Virus versus bacterium</text><path d="M55 91 L1225 91" stroke="#cae4da" stroke-width="3" fill="none"/><text x="300" y="155" text-anchor="middle" fill="#183d33" font-size="34" font-weight="normal" font-family="Arial, sans-serif">Virus: acellular</text><text x="945" y="155" text-anchor="middle" fill="#183d33" font-size="34" font-weight="normal" font-family="Arial, sans-serif">Bacterium: a cell</text><path d="M300 205 L415 270 L415 400 L300 465 L185 400 L185 270 Z" fill="#e7d7ef" stroke="#8c55aa" stroke-width="6"/><path d="M260 290 q85 -55 50 45 t-35 62 t65 25" stroke="#8c55aa" stroke-width="6" fill="none"/><rect x="760" y="250" width="365" height="190" rx="90" fill="#d7ece0" stroke="#117761" stroke-width="2"/><path d="M835 340 q85 -75 140 0 t-105 15" stroke="#8c55aa" stroke-width="6" fill="none"/><circle cx="790" cy="290" r="5" fill="#2867b0" stroke="#2867b0" stroke-width="3"/><circle cx="821" cy="337" r="5" fill="#2867b0" stroke="#2867b0" stroke-width="3"/><circle cx="852" cy="384" r="5" fill="#2867b0" stroke="#2867b0" stroke-width="3"/><circle cx="883" cy="329" r="5" fill="#2867b0" stroke="#2867b0" stroke-width="3"/><circle cx="914" cy="376" r="5" fill="#2867b0" stroke="#2867b0" stroke-width="3"/><circle cx="945" cy="321" r="5" fill="#2867b0" stroke="#2867b0" stroke-width="3"/><circle cx="976" cy="368" r="5" fill="#2867b0" stroke="#2867b0" stroke-width="3"/><circle cx="1007" cy="313" r="5" fill="#2867b0" stroke="#2867b0" stroke-width="3"/><circle cx="1038" cy="360" r="5" fill="#2867b0" stroke="#2867b0" stroke-width="3"/><text x="300" y="555" text-anchor="middle" fill="#183d33" font-size="30" font-weight="normal" font-family="Arial, sans-serif">DNA OR RNA + protein coat;</text><text x="300" y="594" text-anchor="middle" fill="#183d33" font-size="30" font-weight="normal" font-family="Arial, sans-serif">no ribosomes</text><text x="945" y="555" text-anchor="middle" fill="#183d33" font-size="30" font-weight="normal" font-family="Arial, sans-serif">DNA + membrane + cytoplasm +</text><text x="945" y="594" text-anchor="middle" fill="#183d33" font-size="30" font-weight="normal" font-family="Arial, sans-serif">ribosomes</text><text x="640" y="750" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Not drawn at the same scale</text><rect x="45" y="830" width="1190" height="115" rx="18" fill="#f1f6f4" stroke="#d8e6df" stroke-width="2"/><text x="640" y="870" text-anchor="middle" fill="#183d33" font-size="25" font-weight="normal" font-family="Arial, sans-serif">Viruses require suitable host cells for replication. Bacteria are cells.</text><text x="1205" y="972" text-anchor="end" fill="#658074" font-size="15" font-weight="normal" font-family="Arial, sans-serif">SCHEMATIC</text></svg>
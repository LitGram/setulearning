<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#567168"/></marker></defs><rect width="1280" height="980" fill="white"/><text x="640" y="62" text-anchor="middle" fill="#123d33" font-size="40" font-weight="bold" font-family="Arial, sans-serif">Crossing-over creates new allele combinations</text><path d="M55 91 L1225 91" stroke="#cae4da" stroke-width="3" fill="none"/><text x="640" y="150" text-anchor="middle" fill="#183d33" font-size="27" font-weight="normal" font-family="Arial, sans-serif">Four chromatids in a paired replicated chromosome set</text><path d="M320 240 L320 615" stroke="#2867b0" stroke-width="12" fill="none"/><text x="320" y="219" text-anchor="middle" fill="#183d33" font-size="33" font-weight="normal" font-family="Arial, sans-serif">A</text><text x="320" y="660" text-anchor="middle" fill="#183d33" font-size="33" font-weight="normal" font-family="Arial, sans-serif">B</text><path d="M470 240 L470 615" stroke="#2867b0" stroke-width="12" fill="none"/><text x="470" y="219" text-anchor="middle" fill="#183d33" font-size="33" font-weight="normal" font-family="Arial, sans-serif">A</text><text x="470" y="660" text-anchor="middle" fill="#183d33" font-size="33" font-weight="normal" font-family="Arial, sans-serif">B</text><path d="M810 240 L810 615" stroke="#b84c4c" stroke-width="12" fill="none"/><text x="810" y="219" text-anchor="middle" fill="#183d33" font-size="33" font-weight="normal" font-family="Arial, sans-serif">a</text><text x="810" y="660" text-anchor="middle" fill="#183d33" font-size="33" font-weight="normal" font-family="Arial, sans-serif">b</text><path d="M960 240 L960 615" stroke="#b84c4c" stroke-width="12" fill="none"/><text x="960" y="219" text-anchor="middle" fill="#183d33" font-size="33" font-weight="normal" font-family="Arial, sans-serif">a</text><text x="960" y="660" text-anchor="middle" fill="#183d33" font-size="33" font-weight="normal" font-family="Arial, sans-serif">b</text><path d="M470 350 L810 475 M810 350 L470 475" stroke="#8253a3" stroke-width="6" fill="none"/><text x="640" y="415" text-anchor="middle" fill="#8253a3" font-size="24" font-weight="normal" font-family="Arial, sans-serif">Exchange</text><text x="640" y="740" text-anchor="middle" fill="#183d33" font-size="36" font-weight="normal" font-family="Arial, sans-serif">Result: AB  |  Ab  |  aB  |  ab</text><text x="640" y="792" text-anchor="middle" fill="#183d33" font-size="27" font-weight="normal" font-family="Arial, sans-serif">Parental: AB, ab       Recombinant: Ab, aB</text><rect x="45" y="830" width="1190" height="115" rx="18" fill="#f1f6f4" stroke="#d8e6df" stroke-width="2"/><text x="640" y="870" text-anchor="middle" fill="#183d33" font-size="25" font-weight="normal" font-family="Arial, sans-serif">One exchange between non-sister chromatids gives 2 parental + 2</text><text x="640" y="904" text-anchor="middle" fill="#183d33" font-size="25" font-weight="normal" font-family="Arial, sans-serif">recombinant chromatids.</text><text x="1205" y="972" text-anchor="end" fill="#658074" font-size="15" font-weight="normal" font-family="Arial, sans-serif">SCHEMATIC</text></svg>
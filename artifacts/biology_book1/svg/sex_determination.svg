<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#567168"/></marker></defs><rect width="1280" height="980" fill="white"/><text x="640" y="62" text-anchor="middle" fill="#123d33" font-size="40" font-weight="bold" font-family="Arial, sans-serif">Typical human XX–XY chromosome model</text><path d="M55 91 L1225 91" stroke="#cae4da" stroke-width="3" fill="none"/><text x="640" y="140" text-anchor="middle" fill="#183d33" font-size="30" font-weight="normal" font-family="Arial, sans-serif">Sperm chromosomes: X or Y</text><text x="502.5" y="210" text-anchor="middle" fill="#183d33" font-size="38" font-weight="normal" font-family="Arial, sans-serif">X</text><text x="325" y="366.5" text-anchor="middle" fill="#183d33" font-size="38" font-weight="normal" font-family="Arial, sans-serif">X</text><rect x="390" y="240" width="225" height="225" rx="0" fill="#edf6f2" stroke="#a9bcb5" stroke-width="2"/><text x="502.5" y="368.5" text-anchor="middle" fill="#183d33" font-size="52" font-weight="normal" font-family="Arial, sans-serif">XX</text><rect x="615" y="240" width="225" height="225" rx="0" fill="#eaf1fc" stroke="#a9bcb5" stroke-width="2"/><text x="727.5" y="368.5" text-anchor="middle" fill="#183d33" font-size="52" font-weight="normal" font-family="Arial, sans-serif">XY</text><text x="727.5" y="210" text-anchor="middle" fill="#183d33" font-size="38" font-weight="normal" font-family="Arial, sans-serif">Y</text><text x="325" y="591.5" text-anchor="middle" fill="#183d33" font-size="38" font-weight="normal" font-family="Arial, sans-serif">X</text><rect x="390" y="465" width="225" height="225" rx="0" fill="#edf6f2" stroke="#a9bcb5" stroke-width="2"/><text x="502.5" y="593.5" text-anchor="middle" fill="#183d33" font-size="52" font-weight="normal" font-family="Arial, sans-serif">XX</text><rect x="615" y="465" width="225" height="225" rx="0" fill="#eaf1fc" stroke="#a9bcb5" stroke-width="2"/><text x="727.5" y="593.5" text-anchor="middle" fill="#183d33" font-size="52" font-weight="normal" font-family="Arial, sans-serif">XY</text><text x="130" y="430" text-anchor="middle" fill="#183d33" font-size="30" font-weight="normal" font-family="Arial, sans-serif">Egg</text><text x="130" y="469" text-anchor="middle" fill="#183d33" font-size="30" font-weight="normal" font-family="Arial, sans-serif">chromosomes: X</text><text x="640" y="765" text-anchor="middle" fill="#183d33" font-size="29" font-weight="normal" font-family="Arial, sans-serif">Expected chromosome combinations: 1 XX : 1 XY</text><rect x="45" y="830" width="1190" height="115" rx="18" fill="#f1f6f4" stroke="#d8e6df" stroke-width="2"/><text x="640" y="870" text-anchor="middle" fill="#183d33" font-size="25" font-weight="normal" font-family="Arial, sans-serif">Egg contributes X; sperm contributes X or Y. This is a chromosome model,</text><text x="640" y="904" text-anchor="middle" fill="#183d33" font-size="25" font-weight="normal" font-family="Arial, sans-serif">not every variation of sex development.</text><text x="1205" y="972" text-anchor="end" fill="#658074" font-size="15" font-weight="normal" font-family="Arial, sans-serif">SCHEMATIC</text></svg>
AD+ regenerated</text><rect x="45" y="830" width="1190" height="115" rx="18" fill="#f1f6f4" stroke="#d8e6df" stroke-width="2"/><text x="640" y="870" text-anchor="middle" fill="#183d33" font-size="25" font-weight="normal" font-family="Arial, sans-serif">Glycolysis supplies ATP; fermentation regenerates NAD+ for glycolysis.</text><text x="1205" y="972" text-anchor="end" fill="#658074" font-size="15" font-weight="normal" font-family="Arial, sans-serif">SCHEMATIC</text></svg>
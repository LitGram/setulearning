<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#567168"/></marker></defs><rect width="1280" height="980" fill="white"/><text x="640" y="62" text-anchor="middle" fill="#123d33" font-size="40" font-weight="bold" font-family="Arial, sans-serif">Three domains ≠ five kingdoms</text><path d="M55 91 L1225 91" stroke="#cae4da" stroke-width="3" fill="none"/><text x="640" y="143" text-anchor="middle" fill="#2867b0" font-size="29" font-weight="bold" font-family="Arial, sans-serif">Woese: three DOMAIN groups</text><rect x="65" y="180" width="330" height="105" rx="18" fill="#e5eefb" stroke="#bdcfc8" stroke-width="2"/><text x="230" y="240.5" text-anchor="middle" fill="#183d33" font-size="32" font-weight="normal" font-family="Arial, sans-serif">Bacteria</text><rect x="475" y="180" width="330" height="105" rx="18" fill="#e5eefb" stroke="#bdcfc8" stroke-width="2"/><text x="640" y="240.5" text-anchor="middle" fill="#183d33" font-size="32" font-weight="normal" font-family="Arial, sans-serif">Archaea</text><rect x="885" y="180" width="330" height="105" rx="18" fill="#e5eefb" stroke="#bdcfc8" stroke-width="2"/><text x="1050" y="240.5" text-anchor="middle" fill="#183d33" font-size="32" font-weight="normal" font-family="Arial, sans-serif">Eukarya</text><text x="640" y="368" text-anchor="middle" fill="#117761" font-size="29" font-weight="bold" font-family="Arial, sans-serif">Whittaker: historical five KINGDOM groups</text><rect x="45" y="415" width="220" height="105" rx="18" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="155" y="475.5" text-anchor="middle" fill="#183d33" font-size="27" font-weight="normal" font-family="Arial, sans-serif">Monera</text><rect x="290" y="415" width="220" height="105" rx="18" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="400" y="475.5" text-anchor="middle" fill="#183d33" f
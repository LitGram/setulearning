#dfcef1" stroke="#8c55aa" stroke-width="3"/><text x="310" y="160" text-anchor="middle" fill="#183d33" font-size="36" font-weight="normal" font-family="Arial, sans-serif">Prokaryote</text><text x="940" y="160" text-anchor="middle" fill="#183d33" font-size="36" font-weight="normal" font-family="Arial, sans-serif">Eukaryote</text><path d="M260 335 L240 560" stroke="#567168" stroke-width="3" fill="none"/><text x="250" y="600" text-anchor="middle" fill="#183d33" font-size="27" font-weight="normal" font-family="Arial, sans-serif">DNA in nucleoid; no nuclear</text><text x="250" y="636" text-anchor="middle" fill="#183d33" font-size="27" font-weight="normal" font-family="Arial, sans-serif">envelope</text><path d="M940 345 L940 560" stroke="#567168" stroke-width="3" fill="none"/><text x="940" y="600" text-anchor="middle" fill="#183d33" font-size="27" font-weight="normal" font-family="Arial, sans-serif">DNA within a membrane-bound</text><text x="940" y="636" text-anchor="middle" fill="#183d33" font-size="27" font-weight="normal" font-family="Arial, sans-serif">nucleus</text><text x="310" y="740" text-anchor="middle" fill="#183d33" font-size="27" font-weight="normal" font-family="Arial, sans-serif">No membrane-bound organelles</text><text x="940" y="740" text-anchor="middle" fill="#183d33" font-size="27" font-weight="normal" font-family="Arial, sans-serif">Membrane-bound organelles</text><rect x="45" y="830" width="1190" height="115" rx="18" fill="#f1f6f4" stroke="#d8e6df" stroke-width="2"/><text x="640" y="870" text-anchor="middle" fill="#183d33" font-size="25" font-weight="normal" font-family="Arial, sans-serif">Both have DNA, cytoplasm, ribosomes and a plasma membrane. Not to scale.</text><text x="1205" y="972" text-anchor="end" fill="#658074" font-size="15" font-weight="normal" font-family="Arial, sans-serif">SCHEMATIC</text></svg>
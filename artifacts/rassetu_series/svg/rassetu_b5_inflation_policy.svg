<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8Z" fill="#526a61"/></marker></defs><rect width="1440" height="1080" fill="white"/><text x="720" y="65" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="37" font-weight="700">मुद्रास्फीति: मौद्रिक और राजकोषीय प्रतिक्रिया</text><path d="M55 96 H1385" stroke="#dbe8e0" stroke-width="3"/><rect x="520" y="145" width="400" height="105" rx="18" fill="#f7ece8" stroke="#bdcfc6" stroke-width="2"/><text x="720" y="206.16666666666666" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="26" font-weight="400">मांग / लागत दबाव</text><path d="M630 250 L360 365" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M810 250 L1080 365" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="95" y="375" width="510" height="205" rx="18" fill="#eaf2f8" stroke="#bdcfc6" stroke-width="2"/><text x="350" y="469.8333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="25" font-weight="400">मौद्रिक नीति</text><text x="350" y="501.8333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="25" font-weight="400">ब्याज दर / तरलता</text><rect x="835" y="375" width="510" height="205" rx="18" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="1090" y="469.8333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="25" font-weight="400">राजकोषीय नीति</text><text x="1090" y="501.8333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="25" font-weight="400">कर / व्यय</text><path d="M350 590 L720 735" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M1090 590 L720 735" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="400" y="750" width="640" height="110" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="720" y="813" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="24" font-weight="400">मांग, लागत और अपेक्षाओं पर असर</text><rect x="54" y="970" width="1332" height="82" rx="14" fill="#f6f4ef"/><text x="720" y="1001" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="19" font-weight="400">प्रतिनिधि चित्रण — केवल शैक्षिक समझ हेतु; इसे वास्तविक दृश्य का हूबहू चित्र न मानें।</text><text x="720" y="1030" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">Representative illustration — for learning purposes; not a literal depiction. Schematic / not to scale.</text><text x="720" y="940" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">नीतिगत साधन उदाहरण हैं; प्रभाव की दिशा परिस्थितियों पर निर्भर करती है</text></svg>
d8" stroke="#a7422c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M125 760 L170 805" fill="none" stroke="#a7422c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M420 770 L470 720 500 750 450 800 Z" fill="#e7f1e9" stroke="#3d7666" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M475 720 L500 750" fill="none" stroke="#3d7666" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M715 700 Q800 740 885 700 L865 815 Q800 850 735 815 Z" fill="#f5ecd8" stroke="#c38d2f" stroke-width="6"/><path d="M1020 800 V710 H1170 V800 M1040 710 V680 H1150 V710 M1045 745 H1090 V800 M1110 745 H1150 V800" fill="#e6f1f5" stroke="#477c9a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1370 700 L1410 790 1370 840 1330 790 Z" fill="#e6f1f5" stroke="#263746" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1370 840 V865" fill="none" stroke="#263746" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="890" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, sans-serif" font-size="19" font-weight="500" fill="#61727b">प्रतिनिधि वस्तु-चिह्न • किसी विशिष्ट खुदाई की वस्तु का चित्र नहीं</text><rect x="60" y="920" width="1480" height="48" rx="14" fill="#f2efe7"/><text x="800" y="952" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, sans-serif" font-size="19" font-weight="500" fill="#61727b">यह वैचारिक कालक्रम है; सीमांत तिथियां/अवधियां सभी स्थलों पर समान नहीं।</text></svg>
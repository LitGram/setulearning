    </defs><rect width="1440" height="1080" fill="#fbfcfa"/><path d="M0 0H1440V118Q1080 160 720 118T0 118Z" fill="#f0f5f1"/>
    <text x="720" y="70" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="38" font-weight="700">कारण–प्रभाव तर्क: दावे की कड़ी परखें</text><path d="M65 130H1375" stroke="#dbe8e0" stroke-width="3"/><rect x="95" y="210" width="495" height="160" rx="28" fill="#eaf2f8" stroke="#bdcfc6" stroke-width="2"/><circle cx="150" cy="290" r="34" fill="#3976a8" stroke="none" stroke-width="0"/><text x="150" y="300" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="20" font-weight="700">दावा</text><text x="365" y="277" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="25" font-weight="700">कारण X से</text><text x="365" y="315" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="25" font-weight="700">परिणाम Y</text><rect x="850" y="210" width="495" height="160" rx="28" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><circle cx="905" cy="290" r="34" fill="#b38a43" stroke="none" stroke-width="0"/><text x="905" y="300" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="700">Y</text><text x="1110" y="277" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="25" font-weight="700">देखा गया</text><text x="1110" y="315" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="25" font-weight="700">परिणाम</text><path d="M600 290 L830 290" fill="none" stroke="#2f8066" stroke-width="7" marker-end="url(#arrow)"/><rect x="250" y="470" width="410" height="175" rx="28" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><circle cx="310" cy="525" r="31" fill="#2f8066" stroke="none" stroke-width="0"/><text x="310" y="533" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="25" font-weight="700">✓</text><text x="468" y="525" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="600">साक्ष्य</text><text x="468" y="558" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="600">X वास्तव में Y को</text><text x="468" y="591" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="600">बढ़ाता है?</text><rect x="780" y="470" width="410" height="175" rx="28" fill="#f7ece8" stroke="#bdcfc6" stroke-width="2"/><circle cx="840" cy="525" r="31" fill="#bd7149" stroke="none" stroke-width="0"/><text x="840" y="533" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="25" font-weight="700">?</text><text x="998" y="525" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="600">वैकल्पिक कारण</text><text x="998" y="558" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="600">क्या कोई तीसरा कारक</text><text x="998" y="591" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="600">Y समझा सकता है?</text><path d="M485 375 L455 455" fill="none" stroke="#526a61" stroke-width="4" marker-end="url(#arrow)"/><path d="M955 375 L985 455" fill="none" stroke="#526a61" stroke-width="4" marker-end="url(#arrow)"/><path d="M985 658 C985 760 720 770 720 823" fill="none" stroke="#bd7149" stroke-width="4" marker-end="url(#arrow)"/><rect x="330" y="805" width="780" height="86" rx="22" fill="#fff" stroke="#a8cdb8" stroke-width="3"/><text x="720" y="859" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="23" font-weight="650">निष्कर्ष: दावे की कड़ी को समर्थन या चुनौती दें</text>
    <rect x="54" y="956" width="1332" height="94" rx="18" fill="#f6f4ef"/>
    <text x="720" y="988" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="600">सांकेतिक तर्क-मॉडल; X और Y किसी वास्तविक घटना या प्रमाण का दावा नहीं हैं।</text>
    <text x="720" y="1022" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">प्रतिनिधि शैक्षिक चित्रण • आरेख सांकेतिक है; तथ्य/निर्देश के लिए अध्याय-पाठ देखें।</text>
    </svg>
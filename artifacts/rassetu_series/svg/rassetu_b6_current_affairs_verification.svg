    <text x="720" y="70" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="38" font-weight="700">समसामयिकी: स्रोत से परीक्षा-संबंध तक</text><path d="M65 130H1375" stroke="#dbe8e0" stroke-width="3"/><circle cx="150" cy="325" r="27" fill="#3976a8" stroke="none" stroke-width="0"/><text x="150" y="332" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="16" font-weight="700">01</text><rect x="74" y="360" width="164" height="142" rx="25" fill="#eaf2f8" stroke="#bdcfc6" stroke-width="2"/><text x="156" y="406" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="20" font-weight="700">दावा / घटना</text><text x="156" y="443" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="16" font-weight="500">किस बात की चर्चा?</text><path d="M240 432 L278 432" fill="none" stroke="#526a61" stroke-width="3" marker-end="url(#arrow)"/><circle cx="366" cy="430" r="27" fill="#b38a43" stroke="none" stroke-width="0"/><text x="366" y="437" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="16" font-weight="700">02</text><rect x="290" y="465" width="164" height="142" rx="25" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="372" y="511" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="20" font-weight="700">स्रोत + तिथि</text><text x="372" y="548" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="16" font-weight="500">आधिकारिक मूल स्रोत?</text><path d="M456 537 L494 537" fill="none" stroke="#526a61" stroke-width="3" marker-end="url(#arrow)"/><circle cx="582" cy="325" r="27" fill="#2f8066" stroke="none" stroke-width="0"/><text x="582" y="332" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="16" font-weight="700">03</text><rect x="506" y="360" width="164" height="142" rx="25" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="588" y="406" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="20" font-weight="700">निर्णयकर्ता</text><text x="588" y="443" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="16" font-weight="500">कौन-सी संस्था?</text><path d="M672 432 L710 432" fill="none" stroke="#526a61" stroke-width="3" marker-end="url(#arrow)"/><circle cx="798" cy="430" r="27" fill="#bd7149" stroke="none" stroke-width="0"/><text x="798" y="437" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="16" font-weight="700">04</text><rect x="722" y="465" width="164" height="142" rx="25" fill="#f7ece8" stroke="#bdcfc6" stroke-width="2"/><text x="804" y="511" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="20" font-weight="700">कार्रवाई</text><text x="804" y="548" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="16" font-weight="500">नीति / क्रियान्वयन</text><path d="M888 537 L926 537" fill="none" stroke="#526a61" stroke-width="3" marker-end="url(#arrow)"/><circle cx="1014" cy="325" r="27" fill="#3976a8" stroke="none" stroke-width="0"/><text x="1014" y="332" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="16" font-weight="700">05</text><rect x="938" y="360" width="164" height="142" rx="25" fill="#eaf2f8" stroke="#bdcfc6" stroke-width="2"/><text x="1020" y="406" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="20" font-weight="700">प्रभाव</text><text x="1020" y="443" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="16" font-weight="500">क्या प्रमाणित है?</text><path d="M1104 432 L1142 432" fill="none" stroke="#526a61" stroke-width="3" marker-end="url(#arrow)"/><circle cx="1230" cy="430" r="27" fill="#b38a43" stroke="none" stroke-width="0"/><text x="1230" y="437" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="16" font-weight="700">06</text><rect x="1154" y="465" width="164" height="142" rx="25" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="1236" y="511" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="20" font-weight="700">परीक्षा-संबंध</text><text x="1236" y="548" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="16" font-weight="500">क्यों महत्वपूर्ण?</text><rect x="210" y="690" width="1020" height="118" rx="26" fill="#fff" stroke="#d9e5dd" stroke-width="2"/><text x="720" y="737" text-anchor="middle" fill="#2f8066" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="23" font-weight="700">हर तथ्य की तिथि और मूल स्रोत फिर से जांचें</text><text x="720" y="779" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="500">यह जांच-ढांचा है; इसमें कोई 2026 घटना/आंकड़ा दर्ज नहीं है।</text>
    <rect x="54" y="956" width="1332" height="94" rx="18" fill="#f6f4ef"/>
    <text x="720" y="988" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="600">स्रोत-सत्यापन का स्थिर ढांचा; आरेख में समय-संवेदी समाचार या तथ्य नहीं हैं।</text>
    <text x="720" y="1022" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">प्रतिनिधि शैक्षिक चित्रण • आरेख सांकेतिक है; तथ्य/निर्देश के लिए अध्याय-पाठ देखें।</text>

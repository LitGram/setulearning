<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8Z" fill="#526a61"/></marker></defs><rect width="1440" height="1080" fill="white"/><text x="720" y="65" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="37" font-weight="700">राजस्थान के प्रमुख पुरातात्विक स्थल: स्थान-स्मरण मॉडल</text><path d="M55 96 H1385" stroke="#dbe8e0" stroke-width="3"/><rect x="470" y="155" width="500" height="85" rx="18" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="720" y="205.83333333333334" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="25" font-weight="400">स्थल → क्षेत्र संबंध याद करें</text><rect x="95" y="305" width="365" height="150" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="277.5" y="372.8333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">कालीबंगा</text><text x="277.5" y="401.8333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">उत्तर</text><rect x="515" y="305" width="365" height="150" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="697.5" y="372.8333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">बागोर</text><text x="697.5" y="401.8333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">दक्षिण-मध्य</text><rect x="935" y="305" width="365" height="150" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="1117.5" y="372.8333333333333" text-anchor="middle" fill="#
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8Z" fill="#526a61"/></marker></defs><rect width="1440" height="1080" fill="white"/><text x="720" y="65" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="37" font-weight="700">भारत की सार्वजनिक निधियां: तुलना</text><path d="M55 96 H1385" stroke="#dbe8e0" stroke-width="3"/><rect x="70" y="260" width="410" height="420" rx="18" fill="#eaf2f8" stroke="#bdcfc6" stroke-width="2"/><text x="275" y="448.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">भारत की संचित निधि</text><text x="275" y="477.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">सरकारी राजस्व/ऋण</text><text x="275" y="506.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">विनियोग की संसदीय स्वीकृति</text><rect x="525" y="260" width="410" height="420" rx="18" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="730" y="448.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">भारत की आकस्मिकता निधि</text><text x="730" y="477.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">अप्रत्याशित व्यय</text><text x="730" y="506.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">बाद में संसदीय स्वीकृति</text><rect x="980" y="260" width="410" height="420" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="1185" y="448.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">लोक लेखा</text><text x="1185" y="477.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">सरकार न्यासी रूप में</text><text x="1185" y="506.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">संसदीय प्रक्रिया लागू</text><rect x="54" y="970" width="1332" height="82" rx="14" fill="#f6f4ef"/><text x="720" y="1001" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="19" font-weight="400">प्रतिनिधि चित्रण — केवल शैक्षिक समझ हेतु; इसे वास्तविक दृश्य का हूबहू चित्र न मानें।</text><text x="720" y="1030" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">Representative illustration — for learning purposes; not a literal depiction. Schematic / not to scale.</text><text x="720" y="940" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">वित्तीय अनुच्छेद और वर्तमान नियम आधिकारिक पाठ से जांचें</text></svg>
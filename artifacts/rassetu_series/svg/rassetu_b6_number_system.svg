<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8Z" fill="#526a61"/></marker></defs><rect width="1440" height="1080" fill="white"/><text x="720" y="65" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="37" font-weight="700">संख्या पद्धति: समावेशन संबंध</text><path d="M55 96 H1385" stroke="#dbe8e0" stroke-width="3"/><rect x="500" y="135" width="440" height="100" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="720" y="193.33333333333334" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="25" font-weight="400">वास्तविक संख्याएं (ℝ)</text><path d="M610 235 L430 320" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M830 235 L1010 320" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="170" y="330" width="500" height="105" rx="18" fill="#eaf2f8" stroke="#bdcfc6" stroke-width="2"/><text x="420" y="390.5" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="24" font-weight="400">परिमेय संख्याएं (ℚ)</text><rect x="770" y="330" width="500" height="105" rx="18" fill="#f7ece8" stroke="#bdcfc6" stroke-width="2"/><text x="1020" y="390.5" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="24" font-weight="400">अपरिमेय संख्याएं</text><path d="M420 435 L420 495" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="230" y="505" width="380" height="82" rx="18" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="420" y="553.6666666666666" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="23" font-weight="400">पूर्णांक (ℤ)</text><path d="M420 587 L420 635" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="255" y="645" width="330" height="78" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="420" y="691.3333333333334" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">पूर्ण संख्याएं (W)</text><path d="M420 723 L420 765" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="270" y="775" width="300" height="78" rx="18" fill="#eaf2f8" stroke="#bdcfc6" stroke-width="2"/><text x="420" y="821" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="400">प्राकृतिक संख्याएं (ℕ)</text><rect x="54" y="970" width="1332" height="82" rx="14" fill="#f6f4ef"/><text x="720" y="1001" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="19" font-weight="400">प्रतिनिधि चित्रण — केवल शैक्षिक समझ हेतु; इसे वास्तविक दृश्य का हूबहू चित्र न मानें।</text><text x="720" y="1030" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">Representative illustration — for learning purposes; not a literal depiction. Schematic / not to scale.</text><text x="720" y="940" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">ℕ में 0 शामिल है या नहीं, यह प्रयुक्त परिभाषा पर निर्भर कर सकता है</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8Z" fill="#526a61"/></marker></defs><rect width="1440" height="1080" fill="white"/><text x="720" y="65" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="37" font-weight="700">राजस्थान: प्रागैतिहासिक सांस्कृतिक क्रम</text><path d="M55 96 H1385" stroke="#dbe8e0" stroke-width="3"/><rect x="45" y="330" width="250" height="230" rx="18" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="170" y="438" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="400">पुरापाषाण</text><text x="170" y="466" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="400">पत्थर के औजार</text><path d="M296 445 L318 445" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="323" y="330" width="250" height="230" rx="18" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="448" y="438" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="400">मध्यपाषाण</text><text x="448" y="466" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="400">बागोर • तिलवाड़ा</text><path d="M574 445 L596 445" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="601" y="330" width="250" height="230" rx="18" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="726" y="438" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="400">ताम्रपाषाण</text><text x="726" y="466" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="400">आहड़ • गणेश्वर</text><path d="M852 445 L874 445" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="879" y="330" width="250" height="230" rx="18" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="1004" y="438" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="400">कांस्य युग</text><text x="1004" y="466" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="400">कालीबंगा</text><path d="M1130 445 L1152 445" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="1157" y="330" width="250" height="230" rx="18" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="1282" y="438" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="400">प्रारंभिक इतिहास</text><text x="1282" y="466" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="400">बैराठ • नगरी</text><rect x="54" y="970" width="1332" height="82" rx="14" fill="#f6f4ef"/><text x="720" y="1001" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="19" font-weight="400">प्रतिनिधि चित्रण — केवल शैक्षिक समझ हेतु; इसे वास्तविक दृश्य का हूबहू चित्र न मानें।</text><text x="720" y="1030" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">Representative illustration — for learning purposes; not a literal depiction. Schematic / not to scale.</text><text x="720" y="940" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">क्रम शिक्षण हेतु; स्थलों की अवधि/पुरातात्विक व्याख्या में स्रोतों के अनुसार अंतर संभव है</text></svg>
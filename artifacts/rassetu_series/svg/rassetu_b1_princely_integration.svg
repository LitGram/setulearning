<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8Z" fill="#526a61"/></marker></defs><rect width="1440" height="1080" fill="white"/><text x="720" y="65" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="37" font-weight="700">राजस्थान का एकीकरण: चरणबद्ध प्रक्रिया</text><path d="M55 96 H1385" stroke="#dbe8e0" stroke-width="3"/><rect x="55" y="330" width="245" height="190" rx="18" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="177.5" y="432.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">रियासतों का समूह</text><path d="M300 425 L319 425" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="325" y="330" width="245" height="190" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="447.5" y="432.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">मत्स्य संघ</text><path d="M570 425 L589 425" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="595" y="330" width="245" height="190" rx="18" fill="#eaf2f8" stroke="#bdcfc6" stroke-width="2"/><text x="717.5" y="432.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">राजस्थान संघ</text><path d="M840 425 L859 425" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="865" y="330" width="245" height="190" rx="18" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="987.5" y="432.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">वृहद राजस्थान</text><path d="M1110 425 L1129 425" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="1135" y="330" width="245" height="190" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="1257.5" y="432.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">एकीकृत राजस्थान</text><rect x="54" y="970" width="1332" height="82" rx="14" fill="#f6f4ef"/><text x="720" y="1001" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="19" font-weight="400">प्रतिनिधि चित्रण — केवल शैक्षिक समझ हेतु; इसे वास्तविक दृश्य का हूबहू चित्र न मानें।</text><text x="720" y="1030" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">Representative illustration — for learning purposes; not a literal depiction. Schematic / not to scale.</text><text x="720" y="940" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">चरणों और तिथियों को अध्याय के विवरण से मिलाएं</text></svg>
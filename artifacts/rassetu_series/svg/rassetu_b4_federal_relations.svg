<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8Z" fill="#526a61"/></marker></defs><rect width="1440" height="1080" fill="white"/><text x="720" y="65" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="37" font-weight="700">संघ–राज्य संबंध: तीन आयाम</text><path d="M55 96 H1385" stroke="#dbe8e0" stroke-width="3"/><rect x="90" y="240" width="380" height="170" rx="18" fill="#eaf2f8" stroke="#bdcfc6" stroke-width="2"/><text x="280" y="332.6666666666667" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="23" font-weight="400">विधायी</text><rect x="530" y="240" width="380" height="170" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="720" y="332.6666666666667" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="23" font-weight="400">सूचियां / अधिकार</text><rect x="970" y="240" width="380" height="170" rx="18" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="1160" y="332.6666666666667" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="23" font-weight="400">कार्य-समन्वय</text><rect x="250" y="570" width="940" height="160" rx="18" fill="#f7ece8" stroke="#bdcfc6" stroke-width="2"/><text x="720" y="658.3333333333334" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="25" font-weight="400">सहकारी संघवाद • संवैधानिक आवंटन • विवाद-निराकरण</text><rect x="54" y="970" width="1332" height="82" rx="14" fill="#f6f4ef"/><text x="720" y="1001" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="19" font-weight="400">प्रतिनिधि चित्रण — केवल शैक्षिक समझ हेतु; इसे वास्तविक दृश्य का हूबहू चित्र न मानें।</text><text x="720" y="1030" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">Representative illustration — for learning purposes; not a literal depiction. Schematic / not to scale.</text></svg>
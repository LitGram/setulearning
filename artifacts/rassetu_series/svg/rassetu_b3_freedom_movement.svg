ans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="400">असहयोग 1920</text><path d="M839 520 L839 575" stroke="#bdcfc6" stroke-width="3"/><circle cx="1077" cy="520" r="14" fill="#2f8066"/><rect x="977" y="210" width="200" height="190" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="1077" y="312" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="400">सविनय अवज्ञा 1930</text><path d="M1077 510 L1077 402" stroke="#bdcfc6" stroke-width="3"/><circle cx="1315" cy="520" r="14" fill="#2f8066"/><rect x="1215" y="585" width="200" height="190" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="1315" y="687" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="400">भारत छोड़ो 1942</text><path d="M1315 520 L1315 575" stroke="#bdcfc6" stroke-width="3"/><rect x="54" y="970" width="1332" height="82" rx="14" fill="#f6f4ef"/><text x="720" y="1001" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="19" font-weight="400">प्रतिनिधि चित्रण — केवल शैक्षिक समझ हेतु; इसे वास्तविक दृश्य का हूबहू चित्र न मानें।</text><text x="720" y="1030" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">Representative illustration — for learning purposes; not a literal depiction. Schematic / not to scale.</text><text x="720" y="940" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">कालखंड प्रतिनिधि हैं; वास्तविक तिथियों के लिए अध्याय-पाठ देखें</text></svg>
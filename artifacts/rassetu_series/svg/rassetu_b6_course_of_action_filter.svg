    <text x="720" y="70" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="38" font-weight="700">उचित कार्यवाही: तीन प्रश्नों की निर्णय-कसौटी</text><path d="M65 130H1375" stroke="#dbe8e0" stroke-width="3"/><rect x="90" y="225" width="355" height="205" rx="28" fill="#eaf2f8" stroke="#bdcfc6" stroke-width="2"/><circle cx="136" cy="268" r="26" fill="#3976a8" stroke="none" stroke-width="0"/><text x="136" y="276" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="16" font-weight="700">01</text><text x="285" y="318" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="600">क्या कदम समस्या को</text><text x="285" y="352" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="600">हल या कम करता है?</text><text x="267" y="468" text-anchor="middle" fill="#2f8066" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="17" font-weight="650">हाँ → आगे</text><text x="267" y="497" text-anchor="middle" fill="#b94c43" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="17" font-weight="650">नहीं → हटाएं</text><path d="M448 335 L520 335" fill="none" stroke="#2f8066" stroke-width="4" marker-end="url(#arrow)"/><text x="484" y="319" text-anchor="middle" fill="#2f8066" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="16" font-weight="650">हाँ</text><rect x="535" y="225" width="355" height="205" rx="28" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><circle cx="581" cy="268" r="26" fill="#b38a43" stroke="none" stroke-width="0"/><text x="581" y="276" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="16" font-weight="700">02</text><text x="730" y="318" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="600">क्या कदम अत्यधिक कठोर,</text><text x="730" y="352" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="600">गैर-कानूनी या अव्यावहारिक है?</text><text x="712" y="468" text-anchor="middle" fill="#2f8066" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="17" font-weight="650">नहीं → आगे</text><text x="712" y="497" text-anchor="middle" fill="#b94c43" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="17" font-weight="650">हाँ → हटाएं</text><path d="M893 335 L965 335" fill="none" stroke="#2f8066" stroke-width="4" marker-end="url(#arrow)"/><text x="929" y="319" text-anchor="middle" fill="#2f8066" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="16" font-weight="650">नहीं</text><rect x="980" y="225" width="355" height="205" rx="28" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><circle cx="1026" cy="268" r="26" fill="#2f8066" stroke="none" stroke-width="0"/><text x="1026" y="276" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="16" font-weight="700">03</text><text x="1175" y="318" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="600">क्या कदम इससे भी बड़ा</text><text x="1175" y="352" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="600">नया संकट पैदा करेगा?</text><text x="1157" y="468" text-anchor="middle" fill="#2f8066" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="17" font-weight="650">नहीं → उचित विकल्प</text><text x="1157" y="497" text-anchor="middle" fill="#b94c43" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="17" font-weight="650">हाँ → हटाएं</text><rect x="125" y="605" width="550" height="118" rx="26" fill="#e8f4ed" stroke="#a8cdb8" stroke-width="2"/><text x="400" y="654" text-anchor="middle" fill="#2f8066" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="700">तीनों कसौटियां पास</text><text x="400" y="693" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="23" font-weight="600">उचित विकल्प पर विचार करें</text><rect x="765" y="605" width="550" height="118" rx="26" fill="#faece9" stroke="#e3b6af" stroke-width="2"/><text x="1040" y="654" text-anchor="middle" fill="#b94c43" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="700">किसी कसौटी पर विफल</text><text x="1040" y="693" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="23" font-weight="600">विकल्प हटाएं</text><text x="720" y="805" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="500">Q1: समस्या को हल/कम करना चाहिए  •  Q2: कठोर/गैर-कानूनी/अव्यावहारिक न हो  •  Q3: बड़ा नया संकट न बनाए</text>
    <rect x="54" y="956" width="1332" height="94" rx="18" fill="#f6f4ef"/>
    <text x="720" y="988" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="600">30-सेकंड फिल्टर अध्याय में दिए गए तीन प्रश्नों का संक्षिप्त दृश्य-सार है।</text>
    <text x="720" y="1022" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">प्रतिनिधि शैक्षिक चित्रण • आरेख सांकेतिक है; तथ्य/निर्देश के लिए अध्याय-पाठ देखें।</text>

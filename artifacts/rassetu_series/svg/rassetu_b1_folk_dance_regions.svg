<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8Z" fill="#526a61"/></marker></defs><rect width="1440" height="1080" fill="white"/><text x="720" y="65" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="37" font-weight="700">लोकनृत्य: परंपरा से क्षेत्र-स्मरण</text><path d="M55 96 H1385" stroke="#dbe8e0" stroke-width="3"/><rect x="90" y="190" width="590" height="220" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="385" y="292.6666666666667" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="23" font-weight="400">घूमर</text><text x="385" y="322.6666666666667" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="23" font-weight="400">महिलाओं का सामूहिक नृत्य</text><rect x="750" y="190" width="590" height="220" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="1045" y="292.6666666666667" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="23" font-weight="400">गैर</text><text x="1045" y="322.6666666666667" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="23" font-weight="400">होली से जुड़ी परंपरा</text><rect x="90" y="490" width="590" height="220" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="385" y="592.6666666666666" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="23" font-weight="400">कालबेलिया</text><text x="385" y="622.6666666666666" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="23" font-weight="400">समुदाय-आधारित नृत्य</text><rect x="750" y="490" width="590" height="220" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="1045" y="592.6666666666666" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="23" font-weight="400">तेरहताली</text><text x="1045" y="622.6666666666666" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="23" font-weight="400">कामड़ परंपरा</text><rect x="54" y="970" width="1332" height="82" rx="14" fill="#f6f4ef"/><text x="720" y="1001" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="19" font-weight="400">प्रतिनिधि चित्रण — केवल शैक्षिक समझ हेतु; इसे वास्तविक दृश्य का हूबहू चित्र न मानें।</text><text x="720" y="1030" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">Representative illustration — for learning purposes; not a literal depiction. Schematic / not to scale.</text><text x="720" y="940" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">क्षेत्र और समुदाय का संबंध अध्याय से सत्यापित करें</text></svg>
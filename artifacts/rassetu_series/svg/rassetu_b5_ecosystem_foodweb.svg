<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8Z" fill="#526a61"/></marker></defs><rect width="1440" height="1080" fill="white"/><text x="720" y="65" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="37" font-weight="700">पारिस्थितिकी तंत्र: ऊर्जा और पदार्थ</text><path d="M55 96 H1385" stroke="#dbe8e0" stroke-width="3"/><rect x="520" y="145" width="400" height="105" rx="18" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="720" y="206.5" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="27" font-weight="400">सूर्य ऊर्जा</text><path d="M650 250 L400 360" stroke="#b38a43" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M790 250 L1040 360" stroke="#b38a43" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="130" y="370" width="500" height="165" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="380" y="445" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="24" font-weight="400">उत्पादक</text><text x="380" y="476" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="24" font-weight="400">पौधे / शैवाल</text><rect x="810" y="370" width="500" height="165" rx="18" fill="#eaf2f8" stroke="#bdcfc6" stroke-width="2"/><text x="1060" y="445" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="24" font-weight="400">उपभोक्ता</text><text x="1060" y="476" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="24" font-weight="400">विभिन्न पोषण स्तर</text><path d="M630 455 L800 455" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="450" y="665" width="540" height="125" rx="18" fill="#f7ece8" stroke="#bdcfc6" stroke-width="2"/><text x="720" y="735.1666666666666" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="23" font-weight="400">अपघटक पोषक तत्व लौटाते हैं</text><path d="M525 660 L360 540" stroke="#2f8066" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="54" y="970" width="1332" height="82" rx="14" fill="#f6f4ef"/><text x="720" y="1001" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="19" font-weight="400">प्रतिनिधि चित्रण — केवल शैक्षिक समझ हेतु; इसे वास्तविक दृश्य का हूबहू चित्र न मानें।</text><text x="720" y="1030" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">Representative illustration — for learning purposes; not a literal depiction. Schematic / not to scale.</text><text x="720" y="940" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">ऊर्जा एक दिशा में बहती है; पदार्थ चक्रित होते हैं</text></svg>
    <text x="720" y="70" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="38" font-weight="700">पांचवां विकल्प: OMR भरने की सुरक्षित जांच</text><path d="M65 130H1375" stroke="#dbe8e0" stroke-width="3"/><circle cx="720" cy="255" r="76" fill="#eaf2f8" stroke="#3976a8" stroke-width="4"/><text x="720" y="266" text-anchor="middle" fill="#3976a8" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="26" font-weight="700">प्रश्न</text><path d="M680 330 L440 430" fill="none" stroke="#526a61" stroke-width="4" marker-end="url(#arrow)"/><path d="M760 330 L1000 430" fill="none" stroke="#526a61" stroke-width="4" marker-end="url(#arrow)"/><rect x="130" y="425" width="510" height="150" rx="28" fill="#eaf4ed" stroke="#b7d7c3" stroke-width="2"/><circle cx="205" cy="500" r="34" fill="#2f8066" stroke="none" stroke-width="0"/><text x="205" y="510" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="24" font-weight="700">✓</text><text x="430" y="488" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="600">उत्तर सुनिश्चित?</text><text x="430" y="520" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="600">उचित A/B/C/D गोला</text><text x="430" y="552" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="600">निर्देशानुसार भरें</text><rect x="800" y="425" width="510" height="150" rx="28" fill="#f5ead8" stroke="#dec99e" stroke-width="2"/><circle cx="875" cy="500" r="34" fill="#b38a43" stroke="none" stroke-width="0"/><text x="875" y="510" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="24" font-weight="700">?</text><text x="1100" y="488" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="600">अनुत्तरित रखना है?</text><text x="1100" y="520" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="600">पांचवां विकल्प / E</text><text x="1100" y="552" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="21" font-weight="600">यदि आधिकारिक निर्देश कहें</text><path d="M385 585 L540 690" fill="none" stroke="#2f8066" stroke-width="4" marker-end="url(#arrow)"/><path d="M1055 585 L900 690" fill="none" stroke="#b38a43" stroke-width="4" marker-end="url(#arrow)"/><rect x="250" y="690" width="940" height="118" rx="28" fill="#f2f6f3" stroke="#b9d4c5" stroke-width="2"/><text x="720" y="737" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="23" font-weight="700">अंतिम जांच: हर प्रश्न की OMR स्थिति पूरी है?</text><text x="720" y="779" text-anchor="middle" fill="#bd7149" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="19" font-weight="600">विकल्प, कटौती और अतिरिक्त समय की शर्तें अधिसूचना से मिलाएं।</text>
    <rect x="54" y="956" width="1332" height="94" rx="18" fill="#f6f4ef"/>
    <text x="720" y="988" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="600">परीक्षा-निर्देश बदल सकते हैं; विकल्प, दंड और समय के लिए वर्तमान आधिकारिक अधिसूचना मानें।</text>
    <text x="720" y="1022" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">प्रतिनिधि शैक्षिक चित्रण • आरेख सांकेतिक है; तथ्य/निर्देश के लिए अध्याय-पाठ देखें।</text>

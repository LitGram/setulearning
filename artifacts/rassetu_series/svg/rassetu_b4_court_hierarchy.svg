<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8Z" fill="#526a61"/></marker></defs><rect width="1440" height="1080" fill="white"/><text x="720" y="65" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="37" font-weight="700">न्यायपालिका: न्यायालयों का सामान्य क्रम</text><path d="M55 96 H1385" stroke="#dbe8e0" stroke-width="3"/><rect x="250" y="170" width="940" height="130" rx="18" fill="#eaf2f8" stroke="#bdcfc6" stroke-width="2"/><text x="720" y="243" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="24" font-weight="400">भारत का सर्वोच्च न्यायालय</text><rect x="285" y="345" width="870" height="130" rx="18" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="720" y="418" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="24" font-weight="400">राजस्थान उच्च न्यायालय</text><rect x="320" y="520" width="800" height="130" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="720" y="593" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="24" font-weight="400">जिला एवं सत्र न्यायालय</text><rect x="355" y="695" width="730" height="130" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="720" y="768" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="24" font-weight="400">अधीनस्थ न्यायालय</text><rect x="54" y="970" width="1332" height="82" rx="14" fill="#f6f4ef"/><text x="720" y="1001" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="19" font-weight="400">प्रतिनिधि चित्रण — केवल शैक्षिक समझ हेतु; इसे वास्तविक दृश्य का हूबहू चित्र न मानें।</text><text x="720" y="1030" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">Representative illustration — for learning purposes; not a literal depiction. Schematic / not to scale.</text><text x="720" y="940" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">अधिकार-क्षेत्र और अपील का मार्ग मामले/कानून पर निर्भर करता है</text></svg>
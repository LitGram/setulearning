<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8Z" fill="#526a61"/></marker></defs><rect width="1440" height="1080" fill="white"/><text x="720" y="65" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="37" font-weight="700">संख्या-श्रृंखला: पैटर्न खोजने के चरण</text><path d="M55 96 H1385" stroke="#dbe8e0" stroke-width="3"/><rect x="55" y="350" width="250" height="180" rx="18" fill="#eaf2f8" stroke="#bdcfc6" stroke-width="2"/><text x="180" y="447.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">अंतर देखें</text><rect x="331" y="350" width="250" height="180" rx="18" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="456" y="447.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">दूसरे अंतर देखें</text><rect x="607" y="350" width="250" height="180" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="732" y="447.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">गुणा / भाग परखें</text><rect x="883" y="350" width="250" height="180" rx="18" fill="#eaf2f8" stroke="#bdcfc6" stroke-width="2"/><text x="1008" y="447.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">वैकल्पिक पद देखें</text><rect x="1159" y="350" width="250" height="180" rx="18" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="1284" y="447.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">नियम सत्यापित करें</text><rect x="54" y="970" width="1332" height="82" rx="14" fill="#f6f4ef"/><text x="720" y="1001" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="19" font-weight="400">प्रतिनिधि चित्रण — केवल शैक्षिक समझ हेतु; इसे वास्तविक दृश्य का हूबहू चित्र न मानें।</text><text x="720" y="1030" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">Representative illustration — for learning purposes; not a literal depiction. Schematic / not to scale.</text><text x="720" y="940" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">उदाहरण-आधारित अभ्यास; हर श्रृंखला में एक ही नियम नहीं होता</text></svg>
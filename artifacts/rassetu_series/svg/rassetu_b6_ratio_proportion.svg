<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8Z" fill="#526a61"/></marker></defs><rect width="1440" height="1080" fill="white"/><text x="720" y="65" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="37" font-weight="700">अनुपात और समानुपात</text><path d="M55 96 H1385" stroke="#dbe8e0" stroke-width="3"/><rect x="100" y="240" width="500" height="240" rx="18" fill="#eaf2f8" stroke="#bdcfc6" stroke-width="2"/><text x="350" y="351.8333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="28" font-weight="400">अनुपात</text><text x="350" y="386.8333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="28" font-weight="400">a : b</text><rect x="840" y="240" width="500" height="240" rx="18" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="1090" y="351.8333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="28" font-weight="400">समानुपात</text><text x="1090" y="386.8333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="28" font-weight="400">a : b = c : d</text><path d="M620 360 L820 360" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="320" y="620" width="800" height="130" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="720" y="694" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="27" font-weight="400">क्रॉस गुणन: a × d = b × c</text><rect x="54" y="970" width="1332" height="82" rx="14" fill="#f6f4ef"/><text x="720" y="1001" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="19" font-weight="400">प्रतिनिधि चित्रण — केवल शैक्षिक समझ हेतु; इसे वास्तविक दृश्य का हूबहू चित्र न मानें।</text><text x="720" y="1030" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">Representative illustration — for learning purposes; not a literal depiction. Schematic / not to scale.</text><text x="720" y="940" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">b,d ≠ 0; इकाइयों/क्रम को समान रखें</text></svg>
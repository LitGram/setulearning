a UI, sans-serif" font-size="17" font-weight="500" fill="#61727b">किसान आंदोलन</text><circle cx="1201" cy="500" r="20" fill="#a7422c" stroke="#ffffff" stroke-width="5"/><path d="M1201 478 V390" fill="none" stroke="#a7422c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1081" y="255" width="240" height="145" rx="22" fill="#f4e5df" stroke="#d9dfd8" stroke-width="2"/><text x="1201" y="298" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, sans-serif" font-size="22" font-weight="700" fill="#a7422c">1925</text><text x="1201" y="337" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, sans-serif" font-size="22" font-weight="700" fill="#263746">नीमूचाणा</text><text x="1201" y="373" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, sans-serif" font-size="17" font-weight="500" fill="#61727b">अलवर किसान आंदोलन</text><circle cx="1465" cy="500" r="20" fill="#3d7666" stroke="#ffffff" stroke-width="5"/><path d="M1465 522 V590" fill="none" stroke="#3d7666" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1345" y="555" width="240" height="145" rx="22" fill="#e7f1e9" stroke="#d9dfd8" stroke-width="2"/><text x="1465" y="598" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, sans-serif" font-size="22" font-weight="700" fill="#3d7666">1934–35</text><text x="1465" y="637" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, sans-serif" font-size="22" font-weight="700" fill="#263746">कटराथल • कूदन</text><text x="1465" y="673" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, sans-serif" font-size="17" font-weight="500" fill="#61727b">शेखावाटी आंदोलन</text><text x="800" y="790" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, sans-serif" font-size="26" font-weight="700" fill="#263746">स्थान + आंदोलन + काल: तीनों संकेतों से पहचानें</text><rect x="60" y="920" width="1480" height="48" rx="14" fill="#f2efe7"/><text x="800" y="952" text-anchor="middle" font-family="Noto Sans Devanagari, Nirmala UI, sans-serif" font-size="19" font-weight="500" fill="#61727b">साल/दशक और स्थान अध्याय के संक्षेप हैं; यह पूर्ण सूची या मानचित्र नहीं।</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8Z" fill="#526a61"/></marker></defs><rect width="1440" height="1080" fill="white"/><text x="720" y="65" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="37" font-weight="700">गांधीवादी आंदोलनों का कारण–रणनीति–परिणाम</text><path d="M55 96 H1385" stroke="#dbe8e0" stroke-width="3"/><rect x="45" y="355" width="250" height="190" rx="18" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="170" y="457.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">स्थानीय शिकायत</text><path d="M295 450 L315 450" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="321" y="355" width="250" height="190" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="446" y="457.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">जन-संगठन</text><path d="M571 450 L591 450" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="597" y="355" width="250" height="190" rx="18" fill="#eaf2f8" stroke="#bdcfc6" stroke-width="2"/><text x="722" y="457.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">अहिंसक प्रतिरोध</text><path d="M847 450 L867 450" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="873" y="355" width="250" height="190" rx="18" fill="#f5ead8" stroke="#bdcfc6" stroke-width="2"/><text x="998" y="457.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">वार्ता / राजनीतिक दबाव</text><path d="M1123 450 L1143 450" stroke="#526a61" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="1149" y="355" width="250" height="190" rx="18" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="2"/><text x="1274" y="457.3333333333333" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="22" font-weight="400">जन-अनुभव और नया चरण</text><rect x="54" y="970" width="1332" height="82" rx="14" fill="#f6f4ef"/><text x="720" y="1001" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="19" font-weight="400">प्रतिनिधि चित्रण — केवल शैक्षिक समझ हेतु; इसे वास्तविक दृश्य का हूबहू चित्र न मानें।</text><text x="720" y="1030" text-anchor="middle" fill="#655b4c" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">Representative illustration — for learning purposes; not a literal depiction. Schematic / not to scale.</text><text x="720" y="940" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="18" font-weight="400">घटनाओं के विशिष्ट कारण और परिणाम का दावा नहीं; उन्हें अध्याय से पढ़ें</text></svg>
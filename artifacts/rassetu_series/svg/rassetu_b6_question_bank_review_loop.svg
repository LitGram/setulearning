    <text x="720" y="70" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="38" font-weight="700">मास्टर प्रश्न बैंक: हल करें, जांचें, सुधारें</text><path d="M65 130H1375" stroke="#dbe8e0" stroke-width="3"/><circle cx="230" cy="365" r="94" fill="#eaf2f8" stroke="#bdcfc6" stroke-width="3"/><circle cx="230" cy="307" r="24" fill="#3976a8" stroke="none" stroke-width="0"/><text x="230" y="314" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="15" font-weight="700">01</text><text x="230" y="368" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="19" font-weight="700">प्रश्न हल करें</text><text x="230" y="400" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="15" font-weight="500">समय सीमा रखें</text><circle cx="525" cy="245" r="94" fill="#f5ead8" stroke="#bdcfc6" stroke-width="3"/><circle cx="525" cy="187" r="24" fill="#b38a43" stroke="none" stroke-width="0"/><text x="525" y="194" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="15" font-weight="700">02</text><text x="525" y="248" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="19" font-weight="700">उत्तर-कुंजी देखें</text><text x="525" y="280" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="15" font-weight="500">सही विकल्प पहचानें</text><circle cx="905" cy="245" r="94" fill="#f2f6f3" stroke="#bdcfc6" stroke-width="3"/><circle cx="905" cy="187" r="24" fill="#2f8066" stroke="none" stroke-width="0"/><text x="905" y="194" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="15" font-weight="700">03</text><text x="905" y="248" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="19" font-weight="700">व्याख्या पढ़ें</text><text x="905" y="280" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="15" font-weight="500">तर्क / गणना समझें</text><circle cx="1210" cy="365" r="94" fill="#f7ece8" stroke="#bdcfc6" stroke-width="3"/><circle cx="1210" cy="307" r="24" fill="#bd7149" stroke="none" stroke-width="0"/><text x="1210" y="314" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="15" font-weight="700">04</text><text x="1210" y="368" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="19" font-weight="700">गलती का प्रकार</text><text x="1210" y="400" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="15" font-weight="500">अवधारणा • गणना • जल्दबाजी</text><circle cx="720" cy="665" r="94" fill="#e8f4ed" stroke="#bdcfc6" stroke-width="3"/><circle cx="720" cy="607" r="24" fill="#2f8066" stroke="none" stroke-width="0"/><text x="720" y="614" text-anchor="middle" fill="#fff" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="15" font-weight="700">05</text><text x="720" y="668" text-anchor="middle" fill="#20352f" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="19" font-weight="700">दोबारा प्रयास</text><text x="720" y="700" text-anchor="middle" fill="#526a61" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif" font-size="15" font-weight="500">सीख को जांचें</text><path d="M322 340 L433 270" fill="none" stroke="#526a61" stroke-width="4" marker-end="url(#arrow)"/><path d="M617 220 L813 270" fill="none" stroke="#526a61" stroke-width="4" marker-end="url(#arrow)"/><path d="M997 277 L1118 333" fill="none" stroke="#526a61" stroke-width="4" marker-end="url(#arrow)
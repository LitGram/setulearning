<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#526a61"/></marker></defs><rect width="1440" height="1080" fill="#fff"/><text x="720" y="66" text-anchor="middle" fill="#20352f" font-size="38" font-weight="700" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">राजस्थान: फसल–जलवायु संबंध (सांकेतिक क्षेत्र)</text><path d="M64 92 H1376" stroke="#dbe8e0" stroke-width="3"/><rect x="175" y="190" width="500" height="160" rx="20" fill="#f8eee7" stroke="#bdd0c6" stroke-width="2"/><text x="425" y="270" text-anchor="middle" fill="#20352f" font-size="26" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">वर्षा की उपलब्धता</text><text x="425" y="305" text-anchor="middle" fill="#20352f" font-size="26" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">कम / अनिश्चित</text><rect x="765" y="190" width="500" height="160" rx="20" fill="#eef3df" stroke="#bdd0c6" stroke-width="2"/><text x="1015" y="270" text-anchor="middle" fill="#20352f" font-size="26" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">फसल चयन</text><text x="1015" y="305" text-anchor="middle" fill="#20352f" font-size="26" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">सूखा-सहिष्णु फसलें</text><path d="M690 270 L750 270" fill="none" stroke="#526a61" stroke-width="4" marker-end="url(#arr)"/><rect x="175" y="440" width="500" height="160" rx="20" fill="#eaf2f8" stroke="#bdd0c6" stroke-width="2"/><text x="425" y="520" text-anchor="middle" fill="#20352f" font-size="25" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">सिंचाई व मिट्टी</text><text x="425" y="554" text-anchor="middle" fill="#20352f" font-size="25" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">स्थानीय परिस्थितियां</text><rect x="765" y="440" width="500" height="160" rx="20" fill="#e7f2ef" stroke="#bdd0c6" stroke-width="2"/><text x="1015" y="520" text-anchor="middle" fill="#20352f" font-size="26" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">फसल चयन</text><text x="1015" y="555" text-anchor="middle" fill="#20352f" font-size="26" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">क्षेत्रानुसार विविध</text><path d="M690 520 L750 520" fill="none" stroke="#526a61" stroke-width="4" marker-end="url(#arr)"/><text x="720" y="700" text-anchor="middle" fill="#20352f" font-size="24" font-weight="700" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">राजस्थान की कृषि जलवायु और उपलब्ध संसाधनों से प्रभावित होती है</text><rect x="220" y="750" width="1000" height="80" rx="20" fill="#f2f6f3" stroke="#bdd0c6" stroke-width="2"/><text x="720" y="790" text-anchor="middle" fill="#20352f" font-size="21" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">अवधारणात्मक तुलना; किसी निश्चित क्षेत्र या उत्पादन मात्रा का दावा नहीं।</text><rect x="56" y="978" width="1328" height="76" rx="14" fill="#f6f4ef"/><text x="720" y="1007" text-anchor="middle" fill="#655b4c" font-size="19" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">प्रतिनिधि चित्रण — केवल शैक्षिक समझ हेतु; वास्तविक भू-दृश्य का हूबहू चित्र नहीं।</text><text x="720" y="1036" text-anchor="middle" fill="#655b4c" font-size="18" font-family="Arial, sans-serif">Representative illustration — for learning purposes; not a literal depiction. Schematic / not to scale.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#526a61"/></marker></defs><rect width="1440" height="1080" fill="#fff"/><text x="720" y="66" text-anchor="middle" fill="#20352f" font-size="38" font-weight="700" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">राजस्थान अपवाह: नदी-बेसिन संबंध</text><path d="M64 92 H1376" stroke="#dbe8e0" stroke-width="3"/><rect x="470" y="132" width="500" height="90" rx="20" fill="#f5ead8" stroke="#bdd0c6" stroke-width="2"/><text x="720" y="172" text-anchor="middle" fill="#20352f" font-size="27" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">राजस्थान की प्रमुख अपवाह प्रणालियां</text><rect x="62" y="340" width="390" height="130" rx="20" fill="#eaf2f8" stroke="#bdd0c6" stroke-width="2"/><text x="257" y="405" text-anchor="middle" fill="#20352f" font-size="23" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">बंगाल की खाड़ी तंत्र</text><text x="257" y="437" text-anchor="middle" fill="#20352f" font-size="23" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">चंबल • बनास • बाणगंगा</text><rect x="525" y="340" width="390" height="130" rx="20" fill="#e7f2ef" stroke="#bdd0c6" stroke-width="2"/><text x="720" y="405" text-anchor="middle" fill="#20352f" font-size="23" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">अरब सागर तंत्र</text><text x="720" y="437" text-anchor="middle" fill="#20352f" font-size="23" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">माही • साबरमती</text><rect x="988" y="340" width="390" height="130" rx="20" fill="#f8eee7" stroke="#bdd0c6" stroke-width="2"/><text x="1183" y="405" text-anchor="middle" fill="#20352f" font-size="23" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">आंतरिक अपवाह</text><text x="1183" y="437" text-anchor="middle" fill="#20352f" font-size="23" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">लूणी • सांभर बेसिन</text><path d="M600 226 L260 328" fill="none" stroke="#3976a8" stroke-width="4" marker-end="url(#arr)"/><path d="M720 226 L720 328" fill="none" stroke="#2f8066" stroke-width="4" marker-end="url(#arr)"/><path d="M840 226 L1178 328" fill="none" stroke="#bd7149" stroke-width="4" marker-end="url(#arr)"/><text x="720" y="580" text-anchor="middle" fill="#20352f" font-size="23" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">अरावली महत्वपूर्ण जल-विभाजक है; नदी-बेसिनों की सीमाएं इससे अधिक जटिल हैं।</text><rect x="210" y="665" width="1020" height="118" rx="20" fill="#f2f6f3" stroke="#bdd0c6" stroke-width="2"/><text x="720" y="724" text-anchor="middle" fill="#20352f" font-size="22" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">कुछ प्रतिनिधि उदाहरण; दिशात्मक तीर व स्थान सांकेतिक।</text><text x="720" y="755" text-anchor="middle" fill="#20352f" font-size="22" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">पूरा जल-निकास मानचित्र या प्रत्येक नदी का स्रोत/मार्ग नहीं।</text><rect x="56" y="978" width="1328" height="76" rx="14" fill="#f6f4ef"/><text x="720" y="1007" text-anchor="middle" fill="#655b4c" font-size="19" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">प्रतिनिधि चित्रण — केवल शैक्षिक समझ हेतु; वास्तविक भू-दृश्य का हूबहू चित्र नहीं।</text><text x="720" y="1036" text-anchor="middle" fill="#655b4c" font-size="18" font-family="Arial, sans-serif">Representative illustration — for learning purposes; not a literal depiction. Schematic / not to scale.</text></svg>
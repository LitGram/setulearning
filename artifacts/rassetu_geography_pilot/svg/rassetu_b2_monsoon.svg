<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#526a61"/></marker></defs><rect width="1440" height="1080" fill="#fff"/><text x="720" y="66" text-anchor="middle" fill="#20352f" font-size="38" font-weight="700" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">मानसून, अरावली और वर्षा-छाया</text><path d="M64 92 H1376" stroke="#dbe8e0" stroke-width="3"/><rect x="95" y="205" width="320" height="110" rx="20" fill="#eaf2f8" stroke="#bdd0c6" stroke-width="2"/><text x="255" y="260" text-anchor="middle" fill="#20352f" font-size="25" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">अरब सागर से</text><text x="255" y="294" text-anchor="middle" fill="#20352f" font-size="25" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">नमी वाली हवाएं</text><rect x="560" y="180" width="320" height="160" rx="20" fill="#f5ead8" stroke="#bdd0c6" stroke-width="2"/><text x="720" y="260" text-anchor="middle" fill="#20352f" font-size="24" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">अरावली की दिशा</text><text x="720" y="293" text-anchor="middle" fill="#20352f" font-size="24" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">दक्षिण-पश्चिम ↗ उत्तर-पूर्व</text><rect x="1030" y="205" width="320" height="110" rx="20" fill="#e7f2ef" stroke="#bdd0c6" stroke-width="2"/><text x="1190" y="260" text-anchor="middle" fill="#20352f" font-size="24" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">पूर्वी राजस्थान</text><text x="1190" y="293" text-anchor="middle" fill="#20352f" font-size="24" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">अपेक्षाकृत अधिक वर्षा</text><path d="M420 255 L545 255" fill="none" stroke="#3976a8" stroke-width="4" marker-end="url(#arr)"/><path d="M888 255 L1015 255" fill="none" stroke="#3976a8" stroke-width="4" marker-end="url(#arr)"/><text x="720" y="440" text-anchor="middle" fill="#20352f" font-size="22" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">अरब सागरीय शाखा के लिए पर्वत दिशा काफी हद तक समानांतर</text><path d="M850 560 C970 520 1070 540 1240 610" fill="none" stroke="#3976a8" stroke-width="8" stroke-dasharray="14 12"/><rect x="995" y="630" width="340" height="105" rx="20" fill="#f8eee7" stroke="#bdd0c6" stroke-width="2"/><text x="1165" y="682.5" text-anchor="middle" fill="#20352f" font-size="24" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">पश्चिमी भाग</text><text x="1165" y="715.5" text-anchor="middle" fill="#20352f" font-size="24" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">शुष्कता अधिक</text><text x="390" y="610" text-anchor="middle" fill="#20352f" font-size="23" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">वर्षा में क्षेत्रीय अंतर कई कारकों से बनता है</text><rect x="130" y="805" width="1180" height="58" rx="20" fill="#f2f6f3" stroke="#bdd0c6" stroke-width="2"/><text x="720" y="834" text-anchor="middle" fill="#20352f" font-size="20" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">सरलीकृत व्याख्या; वास्तविक मानसून और वर्षा-वितरण अधिक जटिल हैं।</text><rect x="56" y="978" width="1328" height="76" rx="14" fill="#f6f4ef"/><text x="720" y="1007" text-anchor="middle" fill="#655b4c" font-size="19" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">प्रतिनिधि चित्रण — केवल शैक्षिक समझ हेतु; वास्तविक भू-दृश्य का हूबहू चित्र नहीं।</text><text x="720" y="1036" text-anchor="middle" fill="#655b4c" font-size="18" font-family="Arial, sans-serif">Representative illustration — for learning purposes; not a literal depiction. Schematic / not to scale.</text></svg>
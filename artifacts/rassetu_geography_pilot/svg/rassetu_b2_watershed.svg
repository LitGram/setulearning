<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#526a61"/></marker></defs><rect width="1440" height="1080" fill="#fff"/><text x="720" y="66" text-anchor="middle" fill="#20352f" font-size="38" font-weight="700" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">अरावली: जल-विभाजक का सांकेतिक मॉडल</text><path d="M64 92 H1376" stroke="#dbe8e0" stroke-width="3"/><path d="M290 155 L418 128 L540 163 L667 144 L791 184 L918 175 L1034 216 L1155 224 L1192 282 L1159 337 L1098 366 L1054 421 L958 447 L886 504 L786 513 L718 477 L638 491 L572 451 L499 454 L440 403 L367 394 L343 337 L298 306 Z" fill="#f3e6ce" stroke="#9f8061" stroke-width="4"/><path d="M416 127 Q515 200 566 300 T714 469 Q772 368 869 277 T1034 215" fill="none" stroke="#bd7149" stroke-width="16" stroke-linecap="round"/><text x="719" y="302" text-anchor="middle" fill="#bd7149" font-size="24" font-weight="700" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">अरावली पर्वतमाला</text><path d="M585 283 L455 225" fill="none" stroke="#3976a8" stroke-width="4" marker-end="url(#arr)"/><path d="M600 315 L450 378" fill="none" stroke="#3976a8" stroke-width="4" marker-end="url(#arr)"/><path d="M855 305 L1040 250" fill="none" stroke="#3976a8" stroke-width="4" marker-end="url(#arr)"/><path d="M840 335 L1022 414" fill="none" stroke="#3976a8" stroke-width="4" marker-end="url(#arr)"/><text x="392" y="211" text-anchor="middle" fill="#3976a8" font-size="22" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">पश्चिमी अपवाह</text><text x="1054" y="450" text-anchor="middle" fill="#3976a8" font-size="22" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">पूर्वी अपवाह</text><text x="720" y="586" text-anchor="middle" fill="#20352f" font-size="25" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">अरावली के दोनों ओर बहाव की दिशा बदलती है</text><rect x="280" y="670" width="880" height="120" rx="20" fill="#f2f6f3" stroke="#bdd0c6" stroke-width="2"/><text x="720" y="730" text-anchor="middle" fill="#20352f" font-size="23" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">रेखाएं नदी मार्ग या जिला सीमा नहीं दिखातीं।</text><text x="720" y="762" text-anchor="middle" fill="#20352f" font-size="23" font-weight="400" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">केवल जल-विभाजक की अवधारणा समझाती हैं।</text><rect x="56" y="978" width="1328" height="76" rx="14" fill="#f6f4ef"/><text x="720" y="1007" text-anchor="middle" fill="#655b4c" font-size="19" font-family="Noto Sans Devanagari, Nirmala UI, Arial, sans-serif">प्रतिनिधि चित्रण — केवल शैक्षिक समझ हेतु; वास्तविक भू-दृश्य का हूबहू चित्र नहीं।</text><text x="720" y="1036" text-anchor="middle" fill="#655b4c" font-size="18" font-family="Arial, sans-serif">Representative illustration — for learning purposes; not a literal depiction. Schematic / not to scale.</text></svg>
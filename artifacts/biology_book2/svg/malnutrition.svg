<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#567168"/></marker></defs><rect width="1280" height="1040" fill="white"/><text x="640" y="62" text-anchor="middle" fill="#123d33" font-size="36" font-weight="bold" font-family="Arial, sans-serif">Severe malnutrition: two clinical patterns</text><path d="M55 92 L1225 92" stroke="#cae4da" stroke-width="3" fill="none"/><rect x="50" y="130" width="393.3333333333333" height="88" rx="16" fill="#daeede" stroke="#bdcfc8" stroke-width="2"/><text x="246.66666666666666" y="183.86" text-anchor="middle" fill="#183d33" font-size="29" font-weight="normal" font-family="Arial, sans-serif">Feature</text><rect x="443.3333333333333" y="130" width="393.3333333333333" height="88" rx="16" fill="#daeede" stroke="#bdcfc8" stroke-width="2"/><text x="640" y="183.86" text-anchor="middle" fill="#183d33" font-size="29" font-weight="normal" font-family="Arial, sans-serif">Marasmus</text><rect x="836.6666666666666" y="130" width="393.3333333333333" height="88" rx="16" fill="#daeede" stroke="#bdcfc8" stroke-width="2"/><text x="1033.3333333333333" y="183.86" text-anchor="middle" fill="#183d33" font-size="29" font-weight="normal" font-family="Arial, sans-serif">Kwashiorkor</text><rect x="50" y="220" width="393.3333333333333" height="140" rx="16" fill="#eaf1fc" stroke="#bdcfc8" stroke-width="2"/><text x="246.66666666666666" y="298.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Key pattern</text><rect x="443.3333333333333" y="220" width="393.3333333333333" height="140" rx="16" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="640" y="298.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Marked wasting</text><rect x="836.6666666666666" y="220" width="393.3333333333333" height="140" rx="16" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="1033.3333333333333" y="280.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Bilateral nutritional</text><text x="1033.3333333333333" y="316.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">oedema</text><rect x="50" y="360" width="393.3333333333333" height="140" rx="16" fill="#eaf1fc" stroke="#bdcfc8" stroke-width="2"/><text x="246.66666666666666" y="438.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Fat / muscle</text><rect x="443.3333333333333" y="360" width="393.3333333333333" height="140" rx="16" fill="#f5f8f6" stroke="#bdcfc8" stroke-width="2"/><text x="640" y="438.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Severely depleted</text><rect x="836.6666666666666" y="360" width="393.3333333333333" height="140" rx="16" fill="#f5f8f6" stroke="#bdcfc8" stroke-width="2"/><text x="1033.3333333333333" y="438.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Wasting may be masked</text><rect x="50" y="500" width="393.3333333333333" height="140" rx="16" fill="#eaf1fc" stroke="#bdcfc8" stroke-width="2"/><text x="246.66666666666666" y="578.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Skin / hair</text><rect x="443.3333333333333" y="500" width="393.3333333333333" height="140" rx="16" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="640" y="578.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Changes can occur</text><rect x="836.6666666666666" y="500" width="393.3333333333333" height="140" rx="16" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="1033.3333333333333" y="578.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Changes often prominent</text><rect x="50" y="640" width="393.3333333333333" height="140" rx="16" fill="#eaf1fc" stroke="#bdcfc8" stroke-width="2"/><text x="246.66666666666666" y="718.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Assessment</text><rect x="443.3333333333333" y="640" width="393.3333333333333" height="140" rx="16" fill="#f5f8f6" stroke="#bdcfc8" stroke-width="2"/><text x="640" y="700.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Growth + clinical</text><text x="640" y="736.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">assessment</text><rect x="836.6666666666666" y="640" width="393.3333333333333" height="140" rx="16" fill="#f5f8f6" stroke="#bdcfc8" stroke-width="2"/><text x="1033.3333333333333" y="718.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Growth + oedema assessment</text><rect x="45" y="910" width="1190" height="105" rx="16" fill="#f1f6f4" stroke="#d8e6df" stroke-width="2"/><text x="640" y="949" text-anchor="middle" fill="#183d33" font-size="25" font-weight="normal" font-family="Arial, sans-serif">Patterns can overlap. Oedema can conceal low body mass; prompt clinical care</text><text x="640" y="983" text-anchor="middle" fill="#183d33" font-size="25" font-weight="normal" font-family="Arial, sans-serif">is needed.</text><text x="1205" y="1031" text-anchor="end" fill="#658074" font-size="15" font-weight="normal" font-family="Arial, sans-serif">SCHEMATIC</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#567168"/></marker></defs><rect width="1280" height="1040" fill="white"/><text x="640" y="62" text-anchor="middle" fill="#123d33" font-size="36" font-weight="bold" font-family="Arial, sans-serif">Primary and secondary antibody responses</text><path d="M55 92 L1225 92" stroke="#cae4da" stroke-width="3" fill="none"/><path d="M130 750 L1180 750" stroke="#567168" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M130 750 L130 160" stroke="#567168" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="670" y="810" text-anchor="middle" fill="#183d33" font-size="27" font-weight="normal" font-family="Arial, sans-serif">Time (schematic; no numerical scale)</text><text x="55" y="490" transform="rotate(-90 55 490)" text-anchor="middle" font-family="Arial" font-size="27" fill="#183d33">Antibody concentration</text><path d="M150 738 C250 738 265 460 360 490 S420 725 560 730" fill="none" stroke="#2867b0" stroke-width="6"/><path d="M560 730 C600 730 625 265 780 240 S940 420 1150 500" fill="none" stroke="#117761" stroke-width="6"/><path d="M205 800 L205 744" stroke="#567168" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="265" y="855" text-anchor="middle" fill="#2867b0" font-size="25" font-weight="normal" font-family="Arial, sans-serif">First exposure</text><path d="M595 800 L595 744" stroke="#567168" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="735" y="855" text-anchor="middle" fill="#117761" font-size="25" font-weight="normal" font-family="Arial, sans-serif">Second exposure: same antigen</text><text x="350" y="420" text-anchor="middle" fill="#2867b0" font-size="30" font-weight="normal" font-family="Arial, sans-serif">Primary</text><text x="865" y="185" text-anchor="middle" fill="#117761" font-size="30" font-weight="normal" font-family="Arial, sans-serif">Secondary</text><rect x="45" y="910" width="1190" height="105" rx="16" fill="#f1f6f4" stroke="#d8e6df" stroke-width="2"/><text x="640" y="949" text-anchor="middle" fill="#183d33" font-size="25" font-weight="normal" font-family="Arial, sans-serif">Schematic curves, not measured titres. Memory supports a faster response to</text><text x="640" y="983" text-anchor="middle" fill="#183d33" font-size="25" font-weight="normal" font-family="Arial, sans-serif">the same antigen.</text><text x="1205" y="1031" text-anchor="end" fill="#658074" font-size="15" font-weight="normal" font-family="Arial, sans-serif">SCHEMATIC</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#567168"/></marker></defs><rect width="1280" height="1040" fill="white"/><text x="640" y="62" text-anchor="middle" fill="#123d33" font-size="36" font-weight="bold" font-family="Arial, sans-serif">Transmission routes and prevention</text><path d="M55 92 L1225 92" stroke="#cae4da" stroke-width="3" fill="none"/><rect x="50" y="130" width="393.3333333333333" height="88" rx="16" fill="#daeede" stroke="#bdcfc8" stroke-width="2"/><text x="246.66666666666666" y="183.86" text-anchor="middle" fill="#183d33" font-size="29" font-weight="normal" font-family="Arial, sans-serif">Route</text><rect x="443.3333333333333" y="130" width="393.3333333333333" height="88" rx="16" fill="#daeede" stroke="#bdcfc8" stroke-width="2"/><text x="640" y="183.86" text-anchor="middle" fill="#183d33" font-size="29" font-weight="normal" font-family="Arial, sans-serif">Example</text><rect x="836.6666666666666" y="130" width="393.3333333333333" height="88" rx="16" fill="#daeede" stroke="#bdcfc8" stroke-width="2"/><text x="1033.3333333333333" y="183.86" text-anchor="middle" fill="#183d33" font-size="29" font-weight="normal" font-family="Arial, sans-serif">Prevention focus</text><rect x="50" y="220" width="393.3333333333333" height="124" rx="16" fill="#eaf1fc" stroke="#bdcfc8" stroke-width="2"/><text x="246.66666666666666" y="290.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Respiratory</text><rect x="443.3333333333333" y="220" width="393.3333333333333" height="124" rx="16" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="640" y="290.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Influenza / TB</text><rect x="836.6666666666666" y="220" width="393.3333333333333" height="124" rx="16" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="1033.3333333333333" y="272.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Ventilation;</text><text x="1033.3333333333333" y="308.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">disease-specific measures</text><rect x="50" y="344" width="393.3333333333333" height="124" rx="16" fill="#eaf1fc" stroke="#bdcfc8" stroke-width="2"/><text x="246.66666666666666" y="414.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Faecal–oral</text><rect x="443.3333333333333" y="344" width="393.3333333333333" height="124" rx="16" fill="#f5f8f6" stroke="#bdcfc8" stroke-width="2"/><text x="640" y="414.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Cholera</text><rect x="836.6666666666666" y="344" width="393.3333333333333" height="124" rx="16" fill="#f5f8f6" stroke="#bdcfc8" stroke-width="2"/><text x="1033.3333333333333" y="414.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Safe water; sanitation</text><rect x="50" y="468" width="393.3333333333333" height="124" rx="16" fill="#eaf1fc" stroke="#bdcfc8" stroke-width="2"/><text x="246.66666666666666" y="538.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Blood / sexual</text><rect x="443.3333333333333" y="468" width="393.3333333333333" height="124" rx="16" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="640" y="538.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">HIV</text><rect x="836.6666666666666" y="468" width="393.3333333333333" height="124" rx="16" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="1033.3333333333333" y="538.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Sterile equipment; barriers</text><rect x="50" y="592" width="393.3333333333333" height="124" rx="16" fill="#eaf1fc" stroke="#bdcfc8" stroke-width="2"/><text x="246.66666666666666" y="662.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Vector-borne</text><rect x="443.3333333333333" y="592" width="393.3333333333333" height="124" rx="16" fill="#f5f8f6" stroke="#bdcfc8" stroke-width="2"/><text x="640" y="662.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Malaria</text><rect x="836.6666666666666" y="592" width="393.3333333333333" height="124" rx="16" fill="#f5f8f6" stroke="#bdcfc8" stroke-width="2"/><text x="1033.3333333333333" y="644.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Mosquito control; bite</text><text x="1033.3333333333333" y="680.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">prevention</text><rect x="50" y="716" width="393.3333333333333" height="124" rx="16" fill="#eaf1fc" stroke="#bdcfc8" stroke-width="2"/><text x="246.66666666666666" y="786.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Contact</text><rect x="443.3333333333333" y="716" width="393.3333333333333" height="124" rx="16" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="640" y="786.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Some skin infections</text><rect x="836.6666666666666" y="716" width="393.3333333333333" height="124" rx="16" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="1033.3333333333333" y="786.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Hygiene; avoid shared items</text><rect x="45" y="910" width="1190" height="105" rx="16" fill="#f1f6f4" stroke="#d8e6df" stroke-width="2"/><text x="640" y="949" text-anchor="middle" fill="#183d33" font-size="25" font-weight="normal" font-family="Arial, sans-serif">Routes can overlap. Prevention requires measures suited to the pathogen and</text><text x="640" y="983" text-anchor="middle" fill="#183d33" font-size="25" font-weight="normal" font-family="Arial, sans-serif">setting.</text><text x="1205" y="1031" text-anchor="end" fill="#658074" font-size="15" font-weight="normal" font-family="Arial, sans-serif">SCHEMATIC</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#567168"/></marker></defs><rect width="1280" height="1040" fill="white"/><text x="640" y="62" text-anchor="middle" fill="#123d33" font-size="36" font-weight="bold" font-family="Arial, sans-serif">Filtration, reabsorption and secretion</text><path d="M55 92 L1225 92" stroke="#cae4da" stroke-width="3" fill="none"/><rect x="65" y="150" width="460" height="130" rx="16" fill="#eaf1fc" stroke="#bdcfc8" stroke-width="2"/><text x="295" y="226.9" text-anchor="middle" fill="#183d33" font-size="35" font-weight="normal" font-family="Arial, sans-serif">Blood compartment</text><rect x="755" y="150" width="460" height="130" rx="16" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="985" y="226.9" text-anchor="middle" fill="#183d33" font-size="35" font-weight="normal" font-family="Arial, sans-serif">Tubule / filtrate</text><path d="M535 320 L745 320" stroke="#567168" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="640" y="302" text-anchor="middle" fill="#2867b0" font-size="27" font-weight="normal" font-family="Arial, sans-serif">Filtration</text><text x="290" y="365" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Glomerulus → Bowman</text><text x="290" y="400" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">capsule</text><path d="M745 470 L535 470" stroke="#567168" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="640" y="447" text-anchor="middle" fill="#117761" font-size="27" font-weight="normal" font-family="Arial, sans-serif">Reabsorption</text><text x="960" y="520" text-anchor="middle" fill="#183d33" font-size="28" font-weight="normal" font-family="Arial, sans-serif">Tubule → blood</text><path d="M535 670 L745 670" stroke="#567168" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="640" y="647" text-anchor="middle" fill="#b84c4c" font-size="27" font-weight="normal" font-family="Arial, sans-serif">Secretion</text><text x="290" y="730" text-anchor="middle" fill="#183d33" font-size="28" font-weight="normal" font-family="Arial, sans-serif">Blood → tubule</text><path d="M105 290 L105 770" stroke="#2867b0" stroke-width="8" fill="none"/><path d="M1180 290 L1180 770" stroke="#117761" stroke-width="8" fill="none"/><rect x="45" y="910" width="1190" height="105" rx="16" fill="#f1f6f4" stroke="#d8e6df" stroke-width="2"/><text x="640" y="949" text-anchor="middle" fill="#183d33" font-size="25" font-weight="normal" font-family="Arial, sans-serif">Excretion = filtration − reabsorption + secretion. Directions refer to solute</text><text x="640" y="983" text-anchor="middle" fill="#183d33" font-size="25" font-weight="normal" font-family="Arial, sans-serif">movement.</text><text x="1205" y="1031" text-anchor="end" fill="#658074" font-size="15" font-weight="normal" font-family="Arial, sans-serif">SCHEMATIC</text></svg>
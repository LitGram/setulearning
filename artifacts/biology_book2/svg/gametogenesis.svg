<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#567168"/></marker></defs><rect width="1280" height="1040" fill="white"/><text x="640" y="62" text-anchor="middle" fill="#123d33" font-size="36" font-weight="bold" font-family="Arial, sans-serif">Gametogenesis: compare the two pathways</text><path d="M55 92 L1225 92" stroke="#cae4da" stroke-width="3" fill="none"/><rect x="50" y="130" width="393.3333333333333" height="88" rx="16" fill="#daeede" stroke="#bdcfc8" stroke-width="2"/><text x="246.66666666666666" y="183.86" text-anchor="middle" fill="#183d33" font-size="29" font-weight="normal" font-family="Arial, sans-serif">Stage</text><rect x="443.3333333333333" y="130" width="393.3333333333333" height="88" rx="16" fill="#daeede" stroke="#bdcfc8" stroke-width="2"/><text x="640" y="183.86" text-anchor="middle" fill="#183d33" font-size="29" font-weight="normal" font-family="Arial, sans-serif">Spermatogenesis</text><rect x="836.6666666666666" y="130" width="393.3333333333333" height="88" rx="16" fill="#daeede" stroke="#bdcfc8" stroke-width="2"/><text x="1033.3333333333333" y="183.86" text-anchor="middle" fill="#183d33" font-size="29" font-weight="normal" font-family="Arial, sans-serif">Oogenesis</text><rect x="50" y="220" width="393.3333333333333" height="124" rx="16" fill="#eaf1fc" stroke="#bdcfc8" stroke-width="2"/><text x="246.66666666666666" y="290.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Starting meiotic cell</text><rect x="443.3333333333333" y="220" width="393.3333333333333" height="124" rx="16" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="640" y="290.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Primary spermatocyte (2n)</text><rect x="836.6666666666666" y="220" width="393.3333333333333" height="124" rx="16" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="1033.3333333333333" y="290.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Primary oocyte (2n)</text><rect x="50" y="344" width="393.3333333333333" height="124" rx="16" fill="#eaf1fc" stroke="#bdcfc8" stroke-width="2"/><text x="246.66666666666666" y="414.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">After meiosis I</text><rect x="443.3333333333333" y="344" width="393.3333333333333" height="124" rx="16" fill="#f5f8f6" stroke="#bdcfc8" stroke-width="2"/><text x="640" y="414.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Two secondary cells (n)</text><rect x="836.6666666666666" y="344" width="393.3333333333333" height="124" rx="16" fill="#f5f8f6" stroke="#bdcfc8" stroke-width="2"/><text x="1033.3333333333333" y="396.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Secondary oocyte + polar</text><text x="1033.3333333333333" y="432.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">body</text><rect x="50" y="468" width="393.3333333333333" height="124" rx="16" fill="#eaf1fc" stroke="#bdcfc8" stroke-width="2"/><text x="246.66666666666666" y="538.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">After meiosis II</text><rect x="443.3333333333333" y="468" width="393.3333333333333" height="124" rx="16" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="640" y="538.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Four spermatids (n)</text><rect x="836.6666666666666" y="468" width="393.3333333333333" height="124" rx="16" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="1033.3333333333333" y="538.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Ovum + polar body</text><rect x="50" y="592" width="393.3333333333333" height="124" rx="16" fill="#eaf1fc" stroke="#bdcfc8" stroke-width="2"/><text x="246.66666666666666" y="662.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Cytoplasm division</text><rect x="443.3333333333333" y="592" width="393.3333333333333" height="124" rx="16" fill="#f5f8f6" stroke="#bdcfc8" stroke-width="2"/><text x="640" y="662.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Approximately equal</text><rect x="836.6666666666666" y="592" width="393.3333333333333" height="124" rx="16" fill="#f5f8f6" stroke="#bdcfc8" stroke-width="2"/><text x="1033.3333333333333" y="662.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Unequal</text><rect x="50" y="716" width="393.3333333333333" height="124" rx="16" fill="#eaf1fc" stroke="#bdcfc8" stroke-width="2"/><text x="246.66666666666666" y="786.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Completion</text><rect x="443.3333333333333" y="716" width="393.3333333333333" height="124" rx="16" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="640" y="768.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Followed by sperm</text><text x="640" y="804.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">maturation</text><rect x="836.6666666666666" y="716" width="393.3333333333333" height="124" rx="16" fill="#edf6f2" stroke="#bdcfc8" stroke-width="2"/><text x="1033.3333333333333" y="768.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">Meiosis II triggered by</text><text x="1033.3333333333333" y="804.84" text-anchor="middle" fill="#183d33" font-size="26" font-weight="normal" font-family="Arial, sans-serif">fertilisation</text><rect x="45" y="910" width="1190" height="105" rx="16" fill="#f1f6f4" stroke="#d8e6df" stroke-width="2"/><text x="640" y="949" text-anchor="middle" fill="#183d33" font-size="25" font-weight="normal" font-family="Arial, sans-serif">DNA replicates before meiosis I. Haploid does not mean each chromosome is</text><text x="640" y="983" text-anchor="middle" fill="#183d33" font-size="25" font-weight="normal" font-family="Arial, sans-serif">unreplicated.</text><text x="1205" y="1031" text-anchor="end" fill="#658074" font-size="15" font-weight="normal" font-family="Arial, sans-serif">SCHEMATIC</text></svg>